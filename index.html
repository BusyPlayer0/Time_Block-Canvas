<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间块·画布</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --ink:#1f2430; --ink-soft:#6b7280;
    --line:#e5e7eb; --line-strong:#d1d5db;
    --accent:#4f8cff; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,.06);
    --hour-px:80px;          /* 每小时像素 */
    --quarter-px:20px;       /* 15分钟像素 */
    --canvas-h:96px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  .app{max-width:1200px; margin:0 auto; padding:18px 18px 40px}

  /* ---------- 顶部栏 ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); padding:12px 16px; border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:12px;
  }
  .brand{font-size:18px; font-weight:700; margin-right:auto; display:flex; align-items:center; gap:8px}
  .brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#4f8cff,#8b5cf6)}
  .nav-btn{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;display:grid;place-items:center;transition:.15s}
  .nav-btn:hover{background:#f0f2f7}
  .date-input{font-size:15px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
  .today-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
  .today-btn:hover{background:#f0f2f7}
  .topbar .spacer{width:8px}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink-soft)}
  .icon-btn:hover{background:#f0f2f7;color:var(--ink)}
  .danger-btn:hover{background:#fff1f2;color:#ef4444;border-color:#fecaca}

  /* ---------- 类别栏 ---------- */
  .catbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--panel); padding:10px 16px; border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:12px;
  }
  .catbar .label{font-size:13px;color:var(--ink-soft);margin-right:4px}
  .cat-chip{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:#fff;border-radius:20px;padding:6px 12px 6px 8px;font-size:14px;font-weight:500;transition:.15s;
    position:relative;
  }
  .cat-chip .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .cat-chip:hover{border-color:var(--line-strong)}
  .cat-chip.active{outline:2px solid currentColor;outline-offset:1px;font-weight:700}
  .cat-chip .gear{opacity:0;font-size:12px;color:var(--ink-soft);margin-left:2px;cursor:pointer}
  .cat-chip:hover .gear{opacity:1}
  .add-cat{border:1px dashed var(--line-strong);background:#fafbff;color:var(--ink-soft);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
  .add-cat:hover{border-color:var(--accent);color:var(--accent);background:#fff}

  /* ---------- 画布 ---------- */
  .canvas-wrap{
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; margin-bottom:12px;
  }
  .canvas-scroll{overflow-x:auto; overflow-y:hidden; padding:0}
  .canvas-inner{position:relative; width:calc(24 * var(--hour-px)); user-select:none}
  .ruler{position:relative; height:30px; border-bottom:1px solid var(--line); background:#fcfcfe}
  .ruler .hour{position:absolute; top:0; height:30px; border-left:1px solid var(--line); font-size:11px; color:var(--ink-soft); padding-left:5px; padding-top:4px}
  .ruler .quarter{position:absolute; bottom:0; width:1px; height:5px; background:var(--line-strong)}
  .now-line{position:absolute; top:0; bottom:0; width:2px; background:#ef4444; z-index:5; pointer-events:none}
  .now-line::before{content:"现在";position:absolute;top:2px;left:4px;font-size:10px;color:#ef4444;font-weight:700;background:#fff;padding:0 3px;border-radius:3px}
  .lanes{position:relative; height:var(--canvas-h)}
  .lane{position:absolute; left:0; right:0; height:calc(var(--canvas-h) / 3)}
  .grid-bg{position:absolute; inset:0; pointer-events:none}
  .grid-bg .vhour{position:absolute; top:0; bottom:0; width:1px; background:var(--line)}
  .hint{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:var(--ink-soft); font-size:14px; pointer-events:none; text-align:center}
  .hint b{color:var(--accent)}

  .block{
    position:absolute; border-radius:8px; padding:6px 8px; color:#fff; font-size:13px;
    box-shadow:0 1px 3px rgba(0,0,0,.15); cursor:grab; overflow:hidden; min-width:0;
    display:flex; flex-direction:column; justify-content:center; transition:box-shadow .12s, transform .05s;
  }
  .block:hover{box-shadow:0 3px 8px rgba(0,0,0,.22)}
  .block.dragging{cursor:grabbing; opacity:.92; z-index:30}
  .block.selected{outline:2px solid #111827; outline-offset:2px; z-index:20}
  .block.overlap{border:1.5px dashed rgba(255,255,255,.9)}
  .block .b-label{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 1px rgba(0,0,0,.2)}
  .block .b-time{font-size:11px; opacity:.92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .block .handle{position:absolute; top:0; bottom:0; width:7px; cursor:ew-resize; background:rgba(255,255,255,.0)}
  .block .handle.left{left:0; border-radius:8px 0 0 8px}
  .block .handle.right{right:0; border-radius:0 8px 8px 0}
  .block .handle:hover{background:rgba(255,255,255,.25)}
  .draft-block{position:absolute; border-radius:8px; background:rgba(79,140,255,.35); border:2px dashed var(--accent); z-index:15; pointer-events:none}

  /* ---------- 编辑面板 ---------- */
  .edit-panel{
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 16px; margin-bottom:12px; display:none;
  }
  .edit-panel.show{display:block}
  .edit-panel h3{margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px}
  .edit-row{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
  .edit-row label{font-size:13px; color:var(--ink-soft); width:54px; flex:none}
  .edit-row input[type=text], .edit-row textarea{
    flex:1; min-width:120px; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:14px; font-family:inherit;
  }
  .edit-row textarea{resize:vertical; min-height:50px}
  .cat-select{display:flex; flex-wrap:wrap; gap:6px}
  .cat-opt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:16px;padding:4px 10px 4px 7px;font-size:13px;cursor:pointer}
  .cat-opt .dot{width:10px;height:10px;border-radius:50%}
  .cat-opt.active{outline:2px solid currentColor;outline-offset:1px;font-weight:600}
  .edit-time{font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .edit-actions{display:flex; gap:8px; margin-top:4px}
  .btn-del{border:1px solid #fecaca;background:#fff;color:#ef4444;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
  .btn-del:hover{background:#fff1f2}

  /* ---------- 统计区 ---------- */
  .stats{
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; display:flex; gap:24px; align-items:center; flex-wrap:wrap;
  }
  .donut{flex:none; width:130px; height:130px; position:relative}
  .donut svg{transform:rotate(-90deg)}
  .donut .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .donut .center .big{font-size:22px; font-weight:800}
  .donut .center .sm{font-size:11px; color:var(--ink-soft)}
  .stats-list{flex:1; min-width:220px; display:flex; flex-direction:column; gap:7px}
  .stat-row{display:flex; align-items:center; gap:8px; font-size:14px}
  .stat-row .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .stat-row .name{flex:none; width:60px}
  .stat-row .bar{flex:1; height:8px; background:#f0f2f7; border-radius:4px; overflow:hidden}
  .stat-row .bar > i{display:block; height:100%; border-radius:4px}
  .stat-row .dur{flex:none; width:80px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
  .stat-row .pct{flex:none; width:46px; text-align:right; color:var(--ink-soft); font-size:12px}

  /* ---------- 禁用态 ---------- */
  .icon-btn.disabled, .danger-btn.disabled{opacity:.4; cursor:not-allowed; pointer-events:none}

  /* ---------- 模态框 ---------- */
  .modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:100}
  .modal-mask.show{display:flex}
  .modal{background:#fff; border-radius:14px; padding:20px; width:340px; max-width:92vw; box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 14px; font-size:16px}
  .modal .field{margin-bottom:12px}
  .modal .field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:4px}
  .modal .field input[type=text]{width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit}
  .color-grid{display:flex; flex-wrap:wrap; gap:8px}
  .color-grid .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .color-grid .swatch.active{box-shadow:0 0 0 2px var(--ink)}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:8px}
  .btn{border-radius:8px; padding:8px 14px; font-size:14px; font-weight:600; border:1px solid var(--line); background:#fff}
  .btn:hover{background:#f0f2f7}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn-primary:hover{background:#3b78f2}

  /* ---------- toast ---------- */
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#111827; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; opacity:0; transition:.25s; z-index:200; pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ---------- 语音：顶部按钮 + 内嵌麦克风 ---------- */
  .voice-btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .voice-btn:hover{background:#3b78f2}
  .voice-btn.hidden{display:none}
  /* 输入框容器：包裹 input + 麦克风按钮 */
  .input-with-mic{position:relative; flex:1; min-width:120px}
  .input-with-mic input, .input-with-mic textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 34px 7px 10px; font-size:14px; font-family:inherit;
  }
  .input-with-mic textarea{min-height:50px; resize:vertical}
  .mic-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--ink-soft); font-size:16px; padding:2px 4px; cursor:pointer; line-height:1;
    z-index:1;
  }
  .input-with-mic textarea ~ .mic-btn{top:auto; bottom:8px; transform:none}
  .mic-btn:hover{color:var(--accent)}
  .mic-btn.recording{
    color:#ef4444;
    animation:micPulse 1s infinite;
    z-index:2;
  }
  .mic-btn.recording::after{
    content:""; position:absolute; inset:-6px; border-radius:50%;
    border:2.5px solid #ef4444; opacity:.8;
    animation:micRing 1.4s infinite;
  }
  @keyframes micPulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes micRing{
    0%{transform:scale(.9);opacity:.8}
    100%{transform:scale(1.5);opacity:0}
  }
  .mic-btn.hidden{display:none}
  /* 录音中的输入框边框提示 */
  .input-with-mic.recording input, .input-with-mic.recording textarea{
    border-color:#ef4444; box-shadow:0 0 0 2px rgba(239,68,68,.15);
  }

  /* ---------- 语音浮层 ---------- */
  .voice-overlay{position:fixed; inset:0; background:rgba(17,24,39,.55); display:none; align-items:center; justify-content:center; z-index:150; padding:16px}
  .voice-overlay.show{display:flex}
  .voice-card{background:#fff; border-radius:16px; padding:24px; width:420px; max-width:94vw; box-shadow:0 12px 50px rgba(0,0,0,.3); text-align:center}
  .voice-card h3{margin:0 0 6px; font-size:17px}
  .voice-card .sub{font-size:13px; color:var(--ink-soft); margin-bottom:16px}
  .voice-mic{width:84px; height:84px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:34px; cursor:pointer; margin:6px auto 14px; display:grid; place-items:center; position:relative; transition:.2s}
  .voice-mic:hover{background:#3b78f2}
  .voice-mic.listening{background:#ef4444}
  .voice-mic.listening::after{content:""; position:absolute; inset:-8px; border-radius:50%; border:2px solid #ef4444; animation:voiceRing 1.4s infinite}
  @keyframes voiceRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
  .voice-transcript{min-height:48px; padding:12px; background:#f5f6fa; border-radius:10px; font-size:15px; color:var(--ink); margin-bottom:14px; word-break:break-all}
  .voice-transcript.empty{color:#9ca3af; font-style:italic}
  .voice-preview{display:none; background:#eef4ff; border:1px solid #dbe7ff; border-radius:10px; padding:12px 14px; margin-bottom:14px; text-align:left}
  .voice-preview.show{display:block}
  .voice-preview .pv-row{font-size:14px; margin:3px 0; display:flex; gap:6px}
  .voice-preview .pv-row b{color:var(--accent)}
  .voice-preview .pv-err{color:#ef4444; font-size:13px}
  .voice-actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .voice-actions .btn:disabled{opacity:.45; cursor:not-allowed}
  .voice-hint{font-size:12px; color:var(--ink-soft); margin-top:12px}

  /* ---------- 视图切换 ---------- */
  .view-toggle{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .toggle-btn{border:none; background:#fff; padding:7px 12px; font-size:14px; font-weight:600; cursor:pointer; color:var(--ink-soft); transition:.12s}
  .toggle-btn:not(:last-child){border-right:1px solid var(--line)}
  .toggle-btn.active{background:var(--accent); color:#fff}
  .toggle-btn:hover:not(.active){background:#f0f2f7}

  /* ---------- 周视图 ---------- */
  .week-lanes{padding-left:var(--wlw,72px); display:flex; flex-direction:column; user-select:none}
  .day-lane{position:relative; min-height:44px; border-bottom:1px solid var(--line); flex:none}
  .day-lane:last-child{border-bottom:none}
  .day-lane.today{background:#f5f9ff; border-left:3px solid var(--accent); margin-left:-3px}
  .day-lane.dragover{background:#f0f7ff}
  .day-label{
    position:absolute; left:calc(-1*var(--wlw,72px)); top:0; width:var(--wlw,72px); height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--ink); line-height:1.25
  }
  .day-label .sub{font-size:10px; font-weight:400; color:var(--ink-soft)}
  .day-lane.today .day-label{color:var(--accent)}
  .block.week-block{top:4px; height:36px; font-size:11px; padding:3px 6px; border-radius:6px}
  .block.week-block .b-label{font-size:11px}
  .block.week-block .b-time{font-size:10px}
  .draft-block.week-draft{top:4px; height:36px; border-radius:6px}

  @media (max-width:640px){
    :root{--hour-px:60px; --quarter-px:15px}
    .stats{flex-direction:column; align-items:stretch}
    .donut{align-self:center}
    .brand{font-size:16px}
  }
</style>
</head>
<body>
<div class="app">

  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="brand"><span class="logo"></span>时间块·画布</div>
    <button class="nav-btn" id="prevDay" title="前一天">‹</button>
    <input type="date" class="date-input" id="dateInput">
    <button class="nav-btn" id="nextDay" title="后一天">›</button>
    <button class="today-btn" id="todayBtn">今天</button>
    <div class="view-toggle" id="viewToggle">
      <button class="toggle-btn active" data-view="day">日</button>
      <button class="toggle-btn" data-view="week">周</button>
    </div>
    <span class="spacer"></span>
    <button class="voice-btn hidden" id="voiceAddBtn" title="语音添加时间块">🎤 语音添加</button>
    <button class="icon-btn" id="exportBtn">导出</button>
    <button class="icon-btn" id="importBtn">导入</button>
    <button class="icon-btn danger-btn" id="clearBtn">清空当天</button>
    <button class="icon-btn danger-btn" id="clearAllBtn" title="清空所有日期的全部时间块">清空全部</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </div>

  <!-- 类别栏 -->
  <div class="catbar">
    <span class="label">类别</span>
    <div id="catList" style="display:contents"></div>
    <button class="add-cat" id="addCatBtn">+ 新建类别</button>
  </div>

  <!-- 画布 -->
  <div class="canvas-wrap">
    <div class="canvas-scroll">
      <div class="canvas-inner" id="canvasInner">
        <div class="ruler" id="ruler"></div>
        <div class="lanes" id="lanes">
          <div class="grid-bg" id="gridBg"></div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="now-line" id="nowLine"></div>
      </div>
    </div>
  </div>

  <!-- 编辑面板 -->
  <div class="edit-panel" id="editPanel">
    <h3>编辑时间块 <span class="edit-time" id="editTime"></span></h3>
    <div class="edit-row">
      <label>类别</label>
      <div class="cat-select" id="editCatSelect"></div>
    </div>
    <div class="edit-row">
      <label>标签</label>
      <div class="input-with-mic">
        <input type="text" id="editLabel" placeholder="例如：晨会、刷题、跑步…" maxlength="40">
        <button type="button" class="mic-btn hidden" id="micEditLabel" title="语音输入">🎤</button>
      </div>
    </div>
    <div class="edit-row">
      <label>备注</label>
      <div class="input-with-mic">
        <textarea id="editNote" placeholder="可选备注…" maxlength="200"></textarea>
        <button type="button" class="mic-btn hidden" id="micEditNote" title="语音输入">🎤</button>
      </div>
    </div>
    <div class="edit-actions">
      <button class="btn-del" id="delBlockBtn">删除此块</button>
    </div>
  </div>

  <!-- 统计区 -->
  <div class="stats">
    <div class="donut">
      <svg width="130" height="130" viewBox="0 0 130 130" id="donutSvg"></svg>
      <div class="center">
        <div class="big" id="donutBig">0h</div>
        <div class="sm" id="donutSm">/ 24h 已规划</div>
      </div>
    </div>
    <div class="stats-list" id="statsList"></div>
  </div>
</div>

<!-- 模态框：新建/编辑类别 -->
<div class="modal-mask" id="catModal">
  <div class="modal">
    <h3 id="catModalTitle">新建类别</h3>
    <div class="field">
      <label>名称</label>
      <div class="input-with-mic">
        <input type="text" id="catNameInput" maxlength="10" placeholder="例如：阅读">
        <button type="button" class="mic-btn hidden" id="micCatName" title="语音输入">🎤</button>
      </div>
    </div>
    <div class="field">
      <label>颜色</label>
      <div class="color-grid" id="catColorGrid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="catModalCancel">取消</button>
      <button class="btn btn-primary" id="catModalSave">保存</button>
    </div>
  </div>
</div>

<!-- 语音浮层 -->
<div class="voice-overlay" id="voiceOverlay">
  <div class="voice-card">
    <h3>语音添加时间块</h3>
    <div class="sub">点麦克风说话，例如「明天下午3点到5点学习数学」</div>
    <button class="voice-mic" id="voiceMic" title="开始/停止说话">🎤</button>
    <div class="voice-transcript empty" id="voiceTranscript">点击麦克风开始说话…</div>
    <div class="voice-preview" id="voicePreview"></div>
    <div class="voice-actions">
      <button class="btn" id="voiceAgain" disabled>🔄 重说</button>
      <button class="btn btn-primary" id="voiceCreate" disabled>✅ 创建</button>
      <button class="btn" id="voiceClose">关闭</button>
    </div>
    <div class="voice-hint">支持：今天/明天/后天 · 上午/下午/晚上 · 点/点半/点分 · 持续半小时/一小时</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   时间块·画布 —— 全部逻辑
   ============================================================ */

const STORAGE_KEY = "timeblock_canvas_v1";
const QUARTER = 15;          // 吸附粒度（分钟）
const HOUR_PX  = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour-px"));
const Q_PX     = () => HOUR_PX() / 4;

/* ---------- 数据 ---------- */
const DEFAULT_CATS = [
  {id:"work",  name:"工作", color:"#4f8cff"},
  {id:"study", name:"学习", color:"#22c55e"},
  {id:"rest",  name:"休息", color:"#f59e0b"},
  {id:"sport", name:"运动", color:"#ef4444"},
  {id:"sleep", name:"睡眠", color:"#8b5cf6"},
];
const PALETTE = ["#4f8cff","#22c55e","#f59e0b","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#6366f1","#84cc16","#06b6d4","#e11d48"];

let state = loadState();
let currentDate = todayStr();
let isWeekView = false;          // 日/周视图模式
let dragDate = null;             // 周视图拖拽时当前操作的日期
const WEEK_ROW_H = 44;           // 周视图每行高度(px)
const WEEK_LABEL_W = 72;         // 周视图左侧标签宽度(px)
const DAY_NAMES = ["周日","周一","周二","周三","周四","周五","周六"];

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.version===1 && Array.isArray(d.categories)) return d;
    }
  }catch(e){}
  return { version:1, categories: structuredCloneSafe(DEFAULT_CATS), days:{} };
}
function structuredCloneSafe(x){ return JSON.parse(JSON.stringify(x)); }
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n){ return String(n).padStart(2,"0"); }
function shiftDateStr(s, deltaDays){
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(y, m-1, d + deltaDays);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
/* —— 周视图计算 —— */
function weekMonday(refDate){
  const [y,m,d] = refDate.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const dow = dt.getDay();                     // 0=周日, 1=周一 …
  dt.setDate(dt.getDate() + (dow===0 ? -6 : 1-dow));
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function weekDates(refDate){
  const mon = weekMonday(refDate);
  const dates = [];
  for(let i=0;i<7;i++) dates.push(shiftDateStr(mon,i));
  return dates;
}
function dayOfWeekCN(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return DAY_NAMES[new Date(y,m-1,d).getDay()];
}
function weekLabel(dateStr){
  return `${dayOfWeekCN(dateStr)} ${dateStr.slice(5)}`;
}
function findBlockById(id){
  for(const [date, bs] of Object.entries(state.days))
    for(const b of bs) if(b.id === id) return {block:b, date};
  return null;
}
function blocksOf(date){ return state.days[date] || (state.days[date]=[]); }
function catById(id){ return state.categories.find(c=>c.id===id) || {id:id,name:"未分类",color:"#9ca3af"}; }
function uid(){ return "b"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }

/* ---------- 时间格式化 ---------- */
function minToHHMM(min){
  min = ((min % 1440) + 1440) % 1440;
  return `${pad(Math.floor(min/60))}:${pad(min%60)}`;
}
function durStr(min){
  const h = Math.floor(min/60), m = min%60;
  if(h===0) return `${m}m`;
  if(m===0) return `${h}h`;
  return `${h}h${m}m`;
}

/* ---------- 渲染：类别栏 ---------- */
let activeCatId = "work";   // 新建块使用的类别
let editingCatId = null;    // 模态框编辑的类别（null=新建）

function renderCatBar(){
  const el = document.getElementById("catList");
  el.innerHTML = "";
  state.categories.forEach(c=>{
    const chip = document.createElement("div");
    chip.className = "cat-chip" + (c.id===activeCatId ? " active" : "");
    chip.style.color = c.color;
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span><span>${escapeHtml(c.name)}</span><span class="gear" title="编辑类别">✎</span>`;
    chip.addEventListener("click", e=>{
      if(e.target.classList.contains("gear")){ openCatModal(c.id); return; }
      activeCatId = c.id; renderCatBar();
    });
    el.appendChild(chip);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ---------- 渲染：刻度尺 / 网格 / 现在 ---------- */
function renderRuler(){
  const r = document.getElementById("ruler");
  const g = document.getElementById("gridBg");
  r.innerHTML = ""; g.innerHTML = "";
  const hp = HOUR_PX();
  for(let h=0; h<=24; h++){
    const tick = document.createElement("div");
    tick.className = "hour";
    tick.style.left = (h*hp) + "px";
    tick.textContent = h===24 ? "24" : pad(h);
    r.appendChild(tick);
    const vg = document.createElement("div");
    vg.className = "vhour";
    vg.style.left = (h*hp) + "px";
    g.appendChild(vg);
    if(h<24){
      for(let q=1;q<4;q++){
        const qt = document.createElement("div");
        qt.className = "quarter";
        qt.style.left = (h*hp + q*Q_PX()) + "px";
        r.appendChild(qt);
      }
    }
  }
}
function renderNowLine(){
  const nl = document.getElementById("nowLine");
  const now = new Date();
  const minutes = now.getHours()*60 + now.getMinutes();
  if(isWeekView){
    if(weekDates(currentDate).includes(todayStr())){
      nl.style.display = "block";
      nl.style.left = (minutes/60*HOUR_PX()) + "px";
    }else{ nl.style.display = "none"; }
  }else if(currentDate === todayStr()){
    nl.style.display = "block";
    nl.style.left = (minutes/60*HOUR_PX()) + "px";
  }else{ nl.style.display = "none"; }
}

/* ---------- 渲染：时间块 ---------- */
const lanesEl = document.getElementById("lanes");
let selectedBlockId = null;

function renderBlocks(){
  if(!isWeekView){
    // —— 日视图 ——
    // 提前保存 nowLine 引用（清理可能连带删除它）
    const dayNowLine = document.getElementById("nowLine");
    lanesEl.querySelectorAll(".block, .day-lane, .draft-block").forEach(n=>n.remove());
    lanesEl.classList.remove("week-lanes");
    lanesEl.style.height = "var(--canvas-h)";
    lanesEl.style.paddingLeft = "";
    const bs = blocksOf(currentDate);
    const overlapSet = computeOverlaps(bs);
    bs.forEach(b=>renderBlockEl(b, null, false, overlapSet));
    const hint = document.getElementById("hint");
    hint.style.display = bs.length===0 ? "block":"none";
    hint.innerHTML = `在空白处<b>按住鼠标横向拖动</b>即可创建时间块<br>当前选中类别：<b>${escapeHtml(catById(activeCatId).name)}</b>`;
    // 确保 nowLine 恢复为 lanesEl 的兄弟（在 canvasInner 中）
    if(dayNowLine && dayNowLine.parentNode !== canvasInner) canvasInner.appendChild(dayNowLine);
    return;
  }
  // —— 周视图 ——
  lanesEl.classList.add("week-lanes");
  lanesEl.style.height = "auto";
  lanesEl.style.paddingLeft = "var(--wlw,72px)";
  // 保存引用（nowLine 可能在旧 day-lane 内，清理前必须提前保存）
  const dates = weekDates(currentDate);
  const nowLine = document.getElementById("nowLine");
  const todayStrVal = todayStr();
  // 只移除动态元素，保留 #gridBg、#hint 等固定子元素
  lanesEl.querySelectorAll(".block, .day-lane, .draft-block").forEach(n=>n.remove());
  const hintEl = document.getElementById("hint");
  if(hintEl) hintEl.style.display = "none";
  // 把 nowLine 移入今天对应的 day-lane

  dates.forEach((date, idx)=>{
    const lane = document.createElement("div");
    lane.className = "day-lane" + (date===todayStrVal ? " today":"");
    lane.dataset.date = date;
    lane.dataset.idx = idx;
    // 标签
    const label = document.createElement("div");
    label.className = "day-label";
    label.innerHTML = `${dayOfWeekCN(date)}<br><span class="sub">${date.slice(5)}</span>`;
    lane.appendChild(label);
    // 块
    const bs = blocksOf(date);
    const overlapSet = computeOverlaps(bs);
    bs.forEach(b=>renderBlockEl(b, lane, true, overlapSet));
    lanesEl.appendChild(lane);
    // 今天行 → 安放 nowLine（null 保护：翻到其他周再回来时 nowLine 可能已丢失）
    if(date === todayStrVal && nowLine) lane.appendChild(nowLine);
  });
  // 如果 nowLine 没被放入本周（今天不在这周），且还活着，放回 canvasInner 备用
  if(nowLine && !nowLine.parentNode) canvasInner.appendChild(nowLine);
}
function renderBlockEl(b, parent, isWeekMode, overlapSet){
  overlapSet = overlapSet || computeOverlaps([]);
  parent = parent || lanesEl;
  const cat = catById(b.categoryId);
  const el = document.createElement("div");
  const wmode = isWeekMode ? " week-block" : "";
  el.className = "block" + wmode + (b.id===selectedBlockId ? " selected":"") + (overlapSet.has(b.id) ? " overlap":"");
  el.dataset.id = b.id;
  if(isWeekMode) el.dataset.date = parent.dataset.date;
  el.style.background = cat.color;
  el.style.left   = (b.start/60*HOUR_PX()) + "px";
  el.style.width  = (b.length/60*HOUR_PX()) + "px";
  el.style.top    = isWeekMode ? "4px" : "6px";
  el.style.height = isWeekMode ? "36px" : "calc(var(--canvas-h) - 12px)";
  el.innerHTML = `
    <div class="handle left"></div>
    <div class="b-label">${escapeHtml(b.label || cat.name)}</div>
    <div class="b-time">${minToHHMM(b.start)}–${minToHHMM(b.start+b.length)} · ${durStr(b.length)}</div>
    <div class="handle right"></div>`;
  attachBlockHandlers(el, b, isWeekMode ? (parent.dataset.date || currentDate) : null);
  parent.appendChild(el);
}
function computeOverlaps(bs){
  const set = new Set();
  for(let i=0;i<bs.length;i++) for(let j=i+1;j<bs.length;j++){
    const a=bs[i], b=bs[j];
    if(a.start < b.start+b.length && b.start < a.start+a.length){ set.add(a.id); set.add(b.id); }
  }
  return set;
}

/* ---------- 拖拽：在空白处创建 ---------- */
const canvasInner = document.getElementById("canvasInner");
let createDrag = null;   // {startX, draftEl}

function xToMinSnapped(x){
  const min = x / HOUR_PX() * 60;
  return Math.round(min / QUARTER) * QUARTER;
}

/* —— 冲突约束：禁止重叠（撞墙式吸附，不跨越邻块）——
   基于块的【原始位置】计算边界，因此拖动期间空隙恒定、邻块不会“穿模”。 */

/* 移动：返回 start 可取范围 [lo, hi]，使 [start, start+length)
   不与任何邻块重叠，且块停留在当前所在空隙内。
   refStart 为拖动前的原始起点，用于判断邻块在左还是在右。 */
function moveBounds(selfId, refStart, length, date){
  date = date || currentDate;
  let lo = 0, hi = 1440 - length;
  blocksOf(date).filter(b=>b.id!==selfId).forEach(o=>{
    const oEnd = o.start + o.length;
    if(oEnd <= refStart) lo = Math.max(lo, oEnd);
    if(o.start >= refStart + length) hi = Math.min(hi, o.start - length);
  });
  return [lo, hi];
}
/* 缩放左边缘：新 start 的下界 = 左侧邻块的 end（或 0） */
function leftNeighborEnd(selfId, refStart, date){
  date = date || currentDate;
  let lo = 0;
  blocksOf(date).filter(b=>b.id!==selfId).forEach(o=>{
    if(o.start + o.length <= refStart) lo = Math.max(lo, o.start + o.length);
  });
  return lo;
}
/* 缩放右边缘：新右端(start+length)的上界 = 右侧邻块的 start（或 1440） */
function rightNeighborStart(selfId, refStart, refLength, date){
  date = date || currentDate;
  let hi = 1440;
  blocksOf(date).filter(b=>b.id!==selfId).forEach(o=>{
    if(o.start >= refStart + refLength) hi = Math.min(hi, o.start);
  });
  return hi;
}
function clamp(v,lo,hi){ return Math.max(lo, Math.min(v,hi)); }

/* 周视图：根据 y 坐标找到对应的 day-lane 索引 */
function yToDayIdx(clientY){
  const top = lanesEl.getBoundingClientRect().top;
  return Math.max(0, Math.min(Math.floor((clientY - top) / WEEK_ROW_H), 6));
}

lanesEl.addEventListener("pointerdown", e=>{
  if(!isWeekView && e.target!==lanesEl && e.target.id!=="gridBg" && !e.target.classList.contains("hint")) return;
  if(isWeekView && !e.target.closest(".day-lane") && !e.target.classList.contains("day-lane")) return;
  if(e.button!==0 && e.pointerType==="mouse") return;
  // 周视图 lanesEl 有 padding-left，鼠标 x 需要从内容区左边缘算起
  const weekPad = isWeekView ? WEEK_LABEL_W : 0;
  const x = e.clientX - lanesEl.getBoundingClientRect().left - weekPad;
  const startMin = xToMinSnapped(x);
  // 周视图：按 y 坐标映射到日期
  dragDate = isWeekView ? weekDates(currentDate)[yToDayIdx(e.clientY)] : currentDate;
  createDrag = { startMin, draftEl:null, weekPad };
  lanesEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});
lanesEl.addEventListener("pointermove", e=>{
  if(!createDrag) return;
  const pad = createDrag.weekPad || 0;
  const x = e.clientX - lanesEl.getBoundingClientRect().left - pad;
  const curMin = xToMinSnapped(x);
  let s = Math.min(createDrag.startMin, curMin);
  let len = Math.abs(curMin - createDrag.startMin);
  if(len < QUARTER) len = 0;
  if(!createDrag.draftEl && len>=QUARTER){
    const d = document.createElement("div");
    d.className = "draft-block" + (isWeekView ? " week-draft":"");
    if(isWeekView){
      // 把草稿放入对应日期的 day-lane 中
      const lanes = lanesEl.querySelectorAll(".day-lane");
      lanes[yToDayIdx(e.clientY)]?.appendChild(d);
    }else{
      lanesEl.appendChild(d);
    }
    createDrag.draftEl = d;
  }
  if(createDrag.draftEl){
    s = clamp(s, 0, 1440);
    len = clamp(len, 0, 1440 - s);
    [s, len] = trimDraft(s, len, dragDate);
    if(len >= QUARTER){
      createDrag.draftEl.style.left = (s/60*HOUR_PX())+"px";
      createDrag.draftEl.style.width = (len/60*HOUR_PX())+"px";
      if(isWeekView){
        createDrag.draftEl.style.top = "4px";
        createDrag.draftEl.style.height = "36px";
      }else{
        createDrag.draftEl.style.top = "6px";
        createDrag.draftEl.style.height = "calc(var(--canvas-h) - 12px)";
      }
      createDrag.draftEl.style.background = catById(activeCatId).color + "55";
      createDrag.draftEl.style.borderColor = catById(activeCatId).color;
      createDrag.draftEl.style.display = "block";
    }else{
      createDrag.draftEl.style.display = "none";
    }
  }
});
/* 创建时：从锚点 s 向两侧延伸 len，遇到邻块就截断在边缘 */
function trimDraft(s, len, date){
  date = date || currentDate;
  const e = s + len;
  const anchor = createDrag.startMin;
  let newS = s, newE = e;
  blocksOf(date).forEach(o=>{
    const oE = o.start + o.length;
    if(oE <= anchor){ newS = Math.max(newS, oE); }
    if(o.start >= anchor){ newE = Math.min(newE, o.start); }
    if(o.start < anchor && anchor < oE){ newS = Math.max(newS, anchor); newE = Math.min(newE, anchor); }
  });
  return [newS, newE - newS];
}
lanesEl.addEventListener("pointerup", e=>{
  if(!createDrag){ return; }
  if(createDrag.draftEl){
    const pad = createDrag.weekPad || 0;
    const x = e.clientX - lanesEl.getBoundingClientRect().left - pad;
    const curMin = xToMinSnapped(x);
    let s = Math.min(createDrag.startMin, curMin);
    let len = Math.abs(curMin - createDrag.startMin);
    if(len < QUARTER){
      createDrag.draftEl.remove();
    }else{
      s = clamp(s, 0, 1440);
      len = clamp(len, 0, 1440 - s);
      [s, len] = trimDraft(s, len, dragDate);
      s = Math.round(s/QUARTER)*QUARTER;
      len = Math.round(len/QUARTER)*QUARTER;
      if(len < QUARTER){
        createDrag.draftEl.remove();
        toast("这里已被其他时间块占用");
      }else{
        const b = { id:uid(), categoryId:activeCatId, start:s, length:len, label:"", note:"" };
        blocksOf(dragDate).push(b);
        createDrag.draftEl.remove();
        selectedBlockId = b.id;
        saveState(); renderBlocks(); renderStats();
        if(isWeekView){
          // 周视图：保持在周视图不跳转
          renderEditPanel();
        }else{
          renderEditPanel();
        }
        toast(`已创建 ${minToHHMM(s)}–${minToHHMM(s+len)} · ${durStr(len)}`);
      }
    }
  }
  createDrag = null;
});

/* ---------- 拖拽：移动 / 缩放已有块 ---------- */
/* 轻量切换选中：只改 class，不重建 DOM（避免破坏正在进行的指针交互） */
function setSelected(id){
  selectedBlockId = id;
  lanesEl.querySelectorAll(".block").forEach(n=>{
    n.classList.toggle("selected", n.dataset.id === id);
  });
  renderEditPanel();
}

function attachBlockHandlers(el, b, blockDate){
  blockDate = blockDate || currentDate;
  el.addEventListener("pointerdown", e=>{
    e.stopPropagation();
    if(e.button!==0 && e.pointerType==="mouse") return;
    const handle = e.target.classList.contains("handle");
    const mode = handle ? (e.target.classList.contains("left")?"resize-l":"resize-r") : "move";
    setSelected(b.id);
    const startX = e.clientX;
    const orig = { start:b.start, length:b.length };
    el.classList.add("dragging");
    el.setPointerCapture(e.pointerId);

    function move(ev){
      const dx = ev.clientX - startX;
      const dmin = Math.round((dx / HOUR_PX() * 60) / QUARTER) * QUARTER;
      const [lo, hi] = moveBounds(b.id, orig.start, orig.length, blockDate);
      if(mode==="move"){
        b.start = clamp(orig.start + dmin, lo, hi);
      }else if(mode==="resize-l"){
        const leftLo = leftNeighborEnd(b.id, orig.start, blockDate);
        let ns = clamp(orig.start + dmin, leftLo, orig.start + orig.length - QUARTER);
        b.start = ns; b.length = orig.start + orig.length - ns;
      }else if(mode==="resize-r"){
        const rightHi = rightNeighborStart(b.id, orig.start, orig.length, blockDate);
        b.length = clamp(orig.start + orig.length + dmin, orig.length, rightHi - orig.start);
        b.length = Math.max(b.length, QUARTER);
      }
      el.style.left  = (b.start/60*HOUR_PX())+"px";
      el.style.width = (b.length/60*HOUR_PX())+"px";
      el.querySelector(".b-time").textContent = `${minToHHMM(b.start)}–${minToHHMM(b.start+b.length)} · ${durStr(b.length)}`;
      renderEditPanelTime(b);
    }
    function up(ev){
      el.classList.remove("dragging");
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      el.removeEventListener("pointercancel", up);
      saveState(); renderBlocks(); renderStats();
    }
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    e.preventDefault();
  });
  el.addEventListener("dblclick", ()=>{ selectedBlockId = b.id; renderBlocks(); renderEditPanel(); document.getElementById("editLabel").focus(); });
}

/* ---------- 编辑面板 ---------- */
const editPanel = document.getElementById("editPanel");
function renderEditPanel(){
  const found = findBlockById(selectedBlockId);
  const b = found ? found.block : undefined;
  if(!b){ editPanel.classList.remove("show"); return; }
  editPanel.classList.add("show");
  const sel = document.getElementById("editCatSelect");
  sel.innerHTML = "";
  state.categories.forEach(c=>{
    const o = document.createElement("div");
    o.className = "cat-opt" + (c.id===b.categoryId ? " active":"");
    o.style.color = c.color;
    o.innerHTML = `<span class="dot" style="background:${c.color}"></span>${escapeHtml(c.name)}`;
    o.addEventListener("click", ()=>{ b.categoryId = c.id; activeCatId = c.id; saveState(); renderCatBar(); renderBlocks(); renderStats(); renderEditPanel(); });
    sel.appendChild(o);
  });
  document.getElementById("editLabel").value = b.label || "";
  document.getElementById("editNote").value  = b.note || "";
  renderEditPanelTime(b);
}
function renderEditPanelTime(b){
  document.getElementById("editTime").textContent = `${minToHHMM(b.start)}–${minToHHMM(b.start+b.length)} · ${durStr(b.length)}`;
}
document.getElementById("editLabel").addEventListener("input", e=>{
  const found = findBlockById(selectedBlockId); if(!found) return;
  found.block.label = e.target.value; saveState(); renderBlocks();
});
document.getElementById("editNote").addEventListener("input", e=>{
  const found = findBlockById(selectedBlockId); if(!found) return;
  found.block.note = e.target.value; saveState();
});
document.getElementById("delBlockBtn").addEventListener("click", ()=>{
  const found = findBlockById(selectedBlockId);
  if(!found) return;
  const bs = blocksOf(found.date);
  const i = bs.indexOf(found.block);
  if(i>=0){ bs.splice(i,1); selectedBlockId=null; saveState(); renderBlocks(); renderStats(); renderEditPanel(); toast("已删除"); }
});

/* ---------- 统计 + 环形图 ---------- */
function renderStats(){
  // 收集数据：日视图用当天，周视图用 7 天
  const bs = isWeekView
    ? weekDates(currentDate).flatMap(d => blocksOf(d))
    : blocksOf(currentDate);
  const maxTotal = isWeekView ? 7*1440 : 1440;
  const totals = {};
  let total = 0;
  bs.forEach(b=>{ totals[b.categoryId] = (totals[b.categoryId]||0)+b.length; total += b.length; });

  // 环形图（SVG）
  const svg = document.getElementById("donutSvg");
  const cx=65, cy=65, r=54, C=2*Math.PI*r;
  svg.innerHTML = "";
  svg.innerHTML = "";
  // 背景圈
  svg.appendChild(makeCircle(cx,cy,r,C,C,0,"#eef0f4"));
  let offset = 0;
  const order = state.categories.filter(c=>totals[c.id]);
  order.forEach(c=>{
    const len = totals[c.id];
    const dash = (len/total)*C;
    const circ = makeCircle(cx,cy,r,C,dash,offset,c.color);
    svg.appendChild(circ);
    offset += dash;
  });
  document.getElementById("donutBig").textContent = durStr(total);
  const maxLabel = isWeekView ? "/ 168h 周" : "/ 24h 日";
  document.getElementById("donutSm").textContent = maxLabel;

  // 列表
  const list = document.getElementById("statsList");
  list.innerHTML = "";
  const allCats = state.categories.filter(c=>totals[c.id]).sort((a,b)=>totals[b.id]-totals[a.id]);
  if(allCats.length===0){
    list.innerHTML = `<div style="color:var(--ink-soft);font-size:14px">还没有时间块，去画布上拖一个吧 ✨</div>`;
    return;
  }
  allCats.forEach(c=>{
    const m = totals[c.id];
    const pct = total ? Math.round(m/total*100) : 0;
    const row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML = `
      <span class="dot" style="background:${c.color}"></span>
      <span class="name">${escapeHtml(c.name)}</span>
      <span class="bar"><i style="width:${pct}%;background:${c.color}"></i></span>
      <span class="dur">${durStr(m)}</span>
      <span class="pct">${pct}%</span>`;
    list.appendChild(row);
  });
  // 总计行
  const tot = document.createElement("div");
  tot.className = "stat-row";
  tot.style.marginTop="4px"; tot.style.borderTop="1px solid var(--line)"; tot.style.paddingTop="7px";
  tot.innerHTML = `<span class="dot" style="background:#111827"></span><span class="name">合计</span><span class="bar"></span><span class="dur">${durStr(total)}</span><span class="pct">${Math.round(total/maxTotal*100)}%</span>`;
  list.appendChild(tot);
}
function makeCircle(cx,cy,r,C,dash,offset,color){
  const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r);
  c.setAttribute("fill","none"); c.setAttribute("stroke",color); c.setAttribute("stroke-width",14);
  c.setAttribute("stroke-dasharray", `${dash} ${C-dash}`);
  c.setAttribute("stroke-dashoffset", -offset);
  c.setAttribute("stroke-linecap","butt");
  return c;
}

/* ============================================================
   语音识别功能
   ============================================================ */
const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceSupported = !!SpeechAPI;

/* —— 通用引擎：管理一次识别会话 —— */
let activeRecognizer = null;   // 当前正在运行的识别器（全局唯一）
let dictationTarget = null;    // 功能B：当前语音输入的目标输入框
let userStopped = false;       // 是否用户主动停止（true 则不自动重启）
let idleTimer = null;          // 超时计时器：5 秒无语音则自动停止

const VOICE_IDLE_MS = 5000;    // 5 秒不说话自动停止
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ if(activeRecognizer) stopRecognizer(); }, VOICE_IDLE_MS);
}
function clearIdleTimer(){ clearTimeout(idleTimer); }

function stopRecognizer(){
  if(activeRecognizer){
    userStopped = true;        // 标记为主动停止，阻止 onend 自动重启
    clearIdleTimer();
    try{ activeRecognizer.stop(); }catch(e){}
    activeRecognizer = null;
  }
}
/* 功能B：通用语音输入 —— 边说边把识别文字写入 inputEl */
function startDictation(inputEl){
  if(!voiceSupported) return;
  if(activeRecognizer) stopRecognizer();
  dictationTarget = inputEl;
  userStopped = false;
  const rec = new SpeechAPI();
  rec.lang = "zh-CN"; rec.continuous = true; rec.interimResults = true;
  let finalText = inputEl.value || "";
  rec.onresult = e=>{
    resetIdleTimer();           // 每次收到语音结果，重置 5 秒计时
    let interim = "";
    for(let i=e.resultIndex; i<e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    inputEl.value = (finalText + interim).slice(0, inputEl.maxLength || 1000000);
    inputEl.dispatchEvent(new Event("input", {bubbles:true}));
  };
  rec.onerror = e=>{
    // not-allowed / service 异常 → 真正停止，不重启
    if(e.error==="not-allowed" || e.error==="service-not-allowed"){
      toast("麦克风权限被拒绝，请在浏览器设置中允许");
      userStopped = true;
      setMicRecording(inputEl, false);
    }
    // "no-speech" / "aborted" 等交给 onend 处理自动重启，不在这里报错打断
  };
  rec.onend = ()=>{
    // 浏览器在停顿时会自动结束识别 → 若非用户主动停止，则自动重启以延续会话
    if(!userStopped && dictationTarget === inputEl){
      try{ rec.start(); return; }catch(e){ /* 重启失败则结束 */ }
    }
    activeRecognizer = null;
    setMicRecording(inputEl, false);
    dictationTarget = null;
  };
  try{ rec.start(); activeRecognizer = rec; setMicRecording(inputEl, true); resetIdleTimer(); }
  catch(e){ toast("无法启动麦克风"); }
}
function setMicRecording(inputEl, on){
  // 找到与该输入框配对的麦克风按钮和容器
  const wrap = inputEl.closest(".input-with-mic");
  const mic = wrap && wrap.querySelector(".mic-btn");
  if(mic) mic.classList.toggle("recording", on);
  if(wrap) wrap.classList.toggle("recording", on);
}

/* 给三个输入框的麦克风按钮绑定（仅支持的浏览器显示） */
function bindDictationMic(micId, inputId){
  const mic = document.getElementById(micId);
  const input = document.getElementById(inputId);
  if(!voiceSupported || !mic || !input){ return; }
  mic.classList.remove("hidden");
  mic.addEventListener("click", e=>{
    e.preventDefault(); e.stopPropagation();
    if(activeRecognizer === null || dictationTarget !== input){
      startDictation(input);
    }else{
      stopRecognizer();
    }
  });
}
bindDictationMic("micEditLabel", "editLabel");
bindDictationMic("micEditNote",  "editNote");
bindDictationMic("micCatName",   "catNameInput");

/* —— 中文解析器：parseVoiceCommand(text) → {date,start,length,categoryId,label} 或 null —— */
const CN_NUM = {"零":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,"十一":11,"十二":12,"十三":13,"十四":14,"十五":15,"十六":16,"十七":17,"十八":18,"十九":19,"二十":20,"廿":20,"二十一":21,"二十二":22,"二十三":23,"二十四":24};
function cn2num(s){            // 汉字数字 → 数字，支持“十二”“二十”“二十三”
  if(s in CN_NUM) return CN_NUM[s];
  if(/^十/.test(s)) return 10 + (CN_NUM[s.slice(1)] || 0);
  if(/十$/.test(s)) return (CN_NUM[s.slice(0,-1)] || 1) * 10;
  const m = s.match(/^(\d+)十(\d)?$/); if(m) return +m[1]*10 + (+m[2]||0);
  const n = parseInt(s,10); return isNaN(n)? null : n;
}
function parseVoiceCommand(text){
  if(!text || !text.trim()) return null;
  let t = text.replace(/\s+/g,"").replace(/[，。、,.!！?？啊呀嗯吧呢]+$/g,"");
  // —— 1) 日期 ——
  let dateOffset = 0;            // 相对今天的偏移天数
  let dateMatched = true;
  if(/大后天/.test(t)) dateOffset = 3;
  else if(/后天/.test(t)) dateOffset = 2;
  else if(/明天/.test(t)) dateOffset = 1;
  else if(/今天/.test(t)) dateOffset = 0;
  else if(/昨天/.test(t)) dateOffset = -1;
  else if(/前天/.test(t)) dateOffset = -2;
  else dateMatched = false;
  const dateStr = shiftDateStr(todayStr(), dateOffset);
  // —— 2) 时间：先抽“时段词”决定上午/下午 ——
  let period = 0;               // 0=上午(不加), 12=下午
  if(/下午|傍晚|pm/i.test(t)) period = 12;
  else if(/晚上|夜间|晚$/.test(t)) period = 12;
  else if(/中午/.test(t)) period = 0;       // 中午12点 = 12点
  else if(/凌晨|清晨|早上|上午|am/i.test(t)) period = 0;
  // 把“点”前的数字提取出来。先规范化汉字数字。
  function normNums(s){
    // 先保护"一刻""三刻"不被拆开（一→1 后变成"1刻"无法匹配）
    s = s.replace(/([一二三])刻/g, m => cn2num(m[0])===null ? m : cn2num(m[0])+"刻");
    return s.replace(/[零一二两三四五六七八九十廿]+/g, m => (cn2num(m)===null? m : cn2num(m)));
  }
  let nt = normNums(t);
  // 语音识别可能把"四点零五"转写为"4.05"或"4:05" → 标准化为"4点05分"
  // 负向先行 (?!\s*[点分]) 避免重复处理已有 点/分 的文本
  nt = nt.replace(/(\d{1,2})[.:](\d{2})(?!\s*[点分])/g, "$1点$2分");
  // 也处理一位小数如"4.5"(四点五分)→"4点05分"(补零)
  nt = nt.replace(/(\d{1,2})[.:](\d{1})(?!\s*[点分])/g, (_,h,m)=> h+"点0"+m+"分");
  // 时间点正则：数字 + 点( +半 | +一刻/三刻/X刻 | +数字分 | +纯数字分钟 )
  // 整个分钟捕获组可选：点后是“到/跑步”等非数字时匹配空。
  // 纯数字分钟用 (?!\s*点) 防止把“5点30”的 30 误吃为下一个点的小时
  const TIME = /(\d{1,2})\s*点\s*(半|一刻|三刻|\d?刻|(\d{1,2})\s*分|(\d{1,2})(?!\s*点))?/g;
  const points = [];
  let m;
  while((m = TIME.exec(nt)) !== null){
    let h = parseInt(m[1],10);
    if(period===12 && h<12) h += 12;          // 下午/晚上 +12
    if(h>=24) h = 24;
    let min = 0;
    if(m[2]==="半") min = 30;
    else if(m[2]==="刻"||m[2]==="一刻"||m[2]==="1刻") min = 15;
    else if(m[2]==="三刻"||m[2]==="3刻") min = 45;
    else if(m[3]) min = parseInt(m[3],10);     // “X分”
    else if(m[4]) min = parseInt(m[4],10);     // 纯数字分钟（如 12点15 的 15）
    min = Math.min(59, min);
    let total = h*60 + min;
    if(total > 1440) total = 1440;
    points.push(total);
  }
  if(points.length === 0) return null;        // 没解析到时间 → 失败
  // 对齐到 15 分钟
  const snap = v => Math.round(v/QUARTER)*QUARTER;
  let start, length;
  if(points.length >= 2){
    // 第一个点为起点，其后第一个不同的点为终点
    start = points[0];
    let end = points.find(p => p !== start);
    if(end === undefined) end = start + 60;
    if(end < start){
      // 两个可能性：下午延续（+12h）或跨午夜（+24h）
      // 如 12:30到1点 → +12h = 30m（合理），+24h = 750m（不合理）
      // 如 23:00到1点 → +12h = 14h（跨大半天），+24h = 2h（合理）
      const span12 = end + 720 - start;
      const span24 = end + 1440 - start;
      if(span12 <= 720) end += 720;        // 下午延续，时长 <= 12h
      else [start, end] = [end, start];    // 否则正常交换（或由 snap 后处理）
    }
    length = end - start;
    if(length > 1440){ length = 1440; start = 0; }  // 防止超24h
  }else{
    // 单个时间点：看是否有”持续/大概X小时/半小时”等
    start = points[0];
    let dur = 60;                              // 默认1小时
    const dm = nt.match(/(?:持续|大约|大概)?半小时/);
    const hm = nt.match(/(\d{1,2})\s*(?:个)?(?:持续|大约|大概)?小时/);
    if(dm) dur = 30;
    else if(hm) dur = parseInt(hm[1],10)*60;
    length = dur;
  }
  start = snap(start); length = snap(length);
  if(start < 0) start = 0;
  if(start + length > 1440) length = 1440 - start;
  if(length < QUARTER) length = QUARTER;
  // —— 3) 类别：匹配现有类别名 ——
  let categoryId = activeCatId, matchedCatName = null;
  for(const c of state.categories){
    if(t.indexOf(c.name) >= 0){ categoryId = c.id; matchedCatName = c.name; break; }
  }
  // —— 4) 标签：去掉日期/时段/时间/持续时间词，保留类别名 ——
  let label = nt
    .replace(/大后天|后天|明天|今天|昨天|前天/g,"")
    .replace(/下午|傍晚|夜间|晚上|中午|凌晨|清晨|早上|上午/g,"")
    .replace(/\d{1,2}\s*点\s*(半|一刻|三刻|\d?刻|(\d{1,2})\s*分|(\d{1,2})(?!\s*点))?/g,"")
    .replace(/到|至|-|~/g,"")
    .replace(/\d{1,2}\s*(?:个)?(?:持续|大约|大概)?小时/g,"")   // "两小时"/"持续半小时"
    .replace(/(?:持续|大约|大概)?半小时/g,"")                  // 兜底纯"半小时"
    .replace(/\s+/g,"")
    .slice(0,40);
  if(!label) label = matchedCatName || catById(categoryId).name;
  return { date:dateStr, start, length, categoryId, label, dateMatched };
}

document.getElementById("voiceAddBtn").addEventListener("click", ()=>{
  if(!voiceSupported){ toast("当前浏览器不支持语音识别，请用 Chrome 或 Edge"); return; }
  openVoiceOverlay();
});
document.getElementById("voiceClose").addEventListener("click", closeVoiceOverlay);
voiceOverlay.addEventListener("click", e=>{ if(e.target===voiceOverlay) closeVoiceOverlay(); });

function openVoiceOverlay(){
  voiceOverlay.classList.add("show");
  resetVoiceUI();
  // 自动开始
  setTimeout(()=>startVoiceListening(), 100);
}
function closeVoiceOverlay(){
  stopRecognizer();
  voiceListening = false;
  voiceMic.classList.remove("listening");
  voiceOverlay.classList.remove("show");
}
function resetVoiceUI(){
  voiceTranscript.textContent = "点击麦克风开始说话…";
  voiceTranscript.classList.add("empty");
  voicePreview.classList.remove("show");
  voicePreview.innerHTML = "";
  voiceCreateBtn.disabled = true;
  voiceAgainBtn.disabled = true;
  voiceLastText = "";
  voiceParsed = null;
}
voiceMic.addEventListener("click", ()=>{
  if(voiceListening){ stopRecognizer(); }
  else { startVoiceListening(); }
});
function startVoiceListening(){
  if(!voiceSupported || activeRecognizer) return;
  userStopped = false;
  const rec = new SpeechAPI();
  rec.lang = "zh-CN"; rec.continuous = true; rec.interimResults = true;
  resetVoiceUI();
  voiceListening = true;
  voiceMic.classList.add("listening");
  rec.onresult = e=>{
    resetIdleTimer();           // 每次收到语音结果，重置 5 秒计时
    let txt = "";
    for(let i=0;i<e.results.length;i++) txt += e.results[i][0].transcript;
    voiceLastText = txt.trim();
    if(voiceLastText){
      voiceTranscript.textContent = voiceLastText;
      voiceTranscript.classList.remove("empty");
      updateVoicePreview(voiceLastText);
    }
  };
  rec.onerror = e=>{
    if(e.error==="not-allowed" || e.error==="service-not-allowed"){
      toast("麦克风权限被拒绝，请在浏览器设置中允许");
      userStopped = true;
      voiceListening = false; voiceMic.classList.remove("listening");
    }
  };
  rec.onend = ()=>{
    // 浏览器静默自动结束，或 idle 超时触发 stopRecognizer() 后也会进这里
    // 非用户主动停止则自动重启，延续会话
    if(!userStopped && voiceListening){
      try{ rec.start(); return; }catch(e){ /* 重启失败则结束 */ }
    }
    voiceListening = false;
    voiceMic.classList.remove("listening");
    activeRecognizer = null;
    voiceAgainBtn.disabled = false;
  };
  try{ rec.start(); activeRecognizer = rec; resetIdleTimer(); }
  catch(e){ voiceListening=false; voiceMic.classList.remove("listening"); toast("无法启动麦克风"); }
}
function updateVoicePreview(text){
  const r = parseVoiceCommand(text);
  voiceParsed = r;
  if(!r){
    voicePreview.classList.add("show");
    voicePreview.innerHTML = `<div class="pv-err">⚠️ 没听清时间，请说如「下午3点到5点学习数学」</div>`;
    voiceCreateBtn.disabled = true;
    return;
  }
  const catName = catById(r.categoryId).name;
  voicePreview.classList.add("show");
  voicePreview.innerHTML = `
    <div class="pv-row">📅 <b>${r.date}</b></div>
    <div class="pv-row">🕘 <b>${minToHHMM(r.start)}–${minToHHMM(r.start+r.length)}</b> · ${durStr(r.length)}</div>
    <div class="pv-row">🏷️ <b>${escapeHtml(catName)}</b> · ${escapeHtml(r.label)}</div>`;
  voiceCreateBtn.disabled = false;
}
voiceAgainBtn.addEventListener("click", startVoiceListening);
voiceCreateBtn.addEventListener("click", ()=>{
  if(!voiceParsed) return;
  const r = voiceParsed;
  // 重叠检查（与禁止重叠规则一致）
  const clash = blocksOf(r.date).some(b => r.start < b.start+b.length && b.start < r.start+r.length);
  if(clash){
    toast("该时段已有时间块，请重说一个空闲时段");
    return;
  }
  const b = { id:uid(), categoryId:r.categoryId, start:r.start, length:r.length, label:r.label, note:"" };
  blocksOf(r.date).push(b);
  saveState();
  closeVoiceOverlay();
  // 跳到该日期并选中
  if(r.date !== currentDate){ goDate(r.date); }
  selectedBlockId = b.id;
  renderBlocks(); renderStats(); renderEditPanel();
  toast(`已创建 ${minToHHMM(r.start)}–${minToHHMM(r.start+r.length)} · ${r.label}`);
});

// 初始化
updateViewToggle();
renderAll();
// 每分钟刷新"现在"线
setInterval(renderNowLine, 60000);
</script>
</body>
</html>
